<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/estilos.css" />
  </head>
  <body>
    <div class="container-fluid">
      <!--Header-->
      <header>
        <div class="row">
          <nav class="navbar navbar-expand-sm navbar-light">
            <a class="navbar-brand text-white fs-3" href="../index.html"
              ><img
                src="../imagenes/logo.png"
                class="img-fluid"
                style="max-height: 70px; width: auto"
                alt="logoMagosto"
              />Magosto Fresno</a
            >
            <button
              class="navbar-toggler bg-white m-3"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ms-auto mb-2 mb-lg-0 p-4">
                <li class="nav-item text-white">
                  <a
                    class="nav-link active text-white"
                    aria-current="page"
                    href="../index.html"
                    >Inicio</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link text-white" href="historia.html"
                    >Historia</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link text-white" href="tradiciones.html"
                    >Tradiciones</a
                  >
                </li>
                <li class="nav-item">
                  <a class="nav-link text-white" href="contacto.html"
                    >Contacto</a
                  >
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </header>

      <!--Footer-->
      <footer class="row p-5 mt-5">
        <div class="col-12 col-md-4 text-center text-md-start mb-4 mb-md-0">
          <h3>El Magosto</h3>
          <p>
            Celebración tradicional de Fresno de la Polvorosa que mantiene viva
            la esencia cultural de nuestra comunidad a través de generaciones.
          </p>
        </div>

        <div
          class="col-12 col-md-4 d-flex flex-column align-items-center mb-4 mb-md-0"
        >
          <h3>Enlaces rápidos</h3>
          <a href="../index.html" class="text-white text-decoration-none"
            >Inicio</a
          >
          <a href="historia.html" class="text-white text-decoration-none"
            >Historia</a
          >
          <a href="tradiciones.html" class="text-white text-decoration-none"
            >Tradiciones</a
          >
          <a href="contacto.html" class="text-white text-decoration-none"
            >Contacto</a
          >
        </div>

        <div
          class="col-12 col-md-4 d-flex flex-column align-items-center align-items-md-end"
        >
          <h3>Síguenos</h3>
          <div
            class="d-flex flex-row justify-content-center justify-content-md-end gap-3 footer-socialMedia"
          >
            <img src="../imagenes/instagram.png" alt="logoInstagram" />
            <img src="../imagenes/youtube.png" alt="logoYoutube" />
            <img src="../imagenes/facebook.png" alt="logoFacebook" />
          </div>
        </div>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

</html>
